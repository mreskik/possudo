<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="300" y1="0" x2="300" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf4fc" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@700&amp;display=swap');

      .font-sans {
        font-family: 'Google Sans', 'Product Sans', 'Alpa Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .main-title {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #1b365d;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGradient)" />

  <!-- Only NO PICTURE text dead-centered -->
  <text x="300" y="400" text-anchor="middle" dominant-baseline="central" class="font-sans main-title">NO PICTURE</text>
</svg>
