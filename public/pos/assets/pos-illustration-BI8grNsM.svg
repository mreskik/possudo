<svg viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#5da9e9"/>
    </linearGradient>

    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

  </defs>

  <!-- Canvas Background with 16:9 ratio -->
  <rect width="1600" height="900" rx="32" fill="#F8FAFC"/>

  <!-- Ambient Clean Vector Shapes (Crisp, No Blurs) -->
  <circle cx="400" cy="260" r="280" fill="#E0F2FE" fill-opacity="0.6"/>
  <circle cx="1200" cy="650" r="260" fill="#EEF2FF" fill-opacity="0.5"/>
  <circle cx="800" cy="450" r="320" fill="#F0F9FF" fill-opacity="0.5"/>

  <!-- Decorative Isometric Grid Dots -->
  <g opacity="0.35">
    <circle cx="150" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="250" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="350" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="150" cy="260" r="4" fill="#94A3B8"/>
    <circle cx="250" cy="260" r="4" fill="#94A3B8"/>
    <circle cx="1250" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="1350" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="1450" cy="180" r="4" fill="#94A3B8"/>
    <circle cx="1350" cy="260" r="4" fill="#94A3B8"/>
    <circle cx="1450" cy="260" r="4" fill="#94A3B8"/>
  </g>

  <!-- POS Stand Base -->
  <ellipse cx="800" cy="740" rx="360" ry="48" fill="#CBD5E1" opacity="0.5"/>
  <path d="M720 540 L880 540 L850 710 L750 710 Z" fill="#94A3B8" opacity="0.65"/>
  <ellipse cx="800" cy="710" rx="140" ry="24" fill="#64748B"/>

  <!-- Main POS Screen Frame (Tablet Display) -->
  <g filter="url(#softShadow)">
    <!-- Outer Bezel -->
    <rect x="420" y="160" width="760" height="480" rx="36" fill="url(#darkGrad)"/>
    <rect x="422" y="162" width="756" height="476" rx="34" stroke="#475569" stroke-width="3" opacity="0.6"/>

    <!-- Screen Glass Surface -->
    <rect x="444" y="184" width="712" height="432" rx="24" fill="#FFFFFF"/>

    <!-- Inside POS UI Interface -->
    <!-- Top POS Screen Header -->
    <rect x="444" y="184" width="712" height="56" rx="24" fill="#F8FAFC"/>
    <rect x="470" y="202" width="80" height="20" rx="6" fill="#5da9e9"/>
    <text x="480" y="216" font-family="'Google Sans Flex', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">POS</text>
    <circle cx="1110" cy="212" r="5" fill="#10B981"/>
    <rect x="1030" y="204" width="65" height="16" rx="8" fill="#E2E8F0"/>

    <!-- Left Category Panel in POS -->
    <rect x="466" y="260" width="400" height="64" rx="14" fill="#F1F5F9"/>
    <circle cx="498" cy="292" r="18" fill="#5da9e9"/>
    <rect x="528" y="280" width="160" height="12" rx="4" fill="#1E293B"/>
    <rect x="528" y="298" width="90" height="8" rx="3" fill="#94A3B8"/>
    <rect x="790" y="284" width="60" height="16" rx="6" fill="#5da9e9" fill-opacity="0.15"/>

    <rect x="466" y="336" width="400" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="498" cy="368" r="18" fill="#F59E0B"/>
    <rect x="528" y="356" width="140" height="12" rx="4" fill="#1E293B"/>
    <rect x="528" y="374" width="80" height="8" rx="3" fill="#94A3B8"/>

    <rect x="466" y="412" width="400" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="498" cy="444" r="18" fill="#10B981"/>
    <rect x="528" y="432" width="170" height="12" rx="4" fill="#1E293B"/>
    <rect x="528" y="450" width="100" height="8" rx="3" fill="#94A3B8"/>

    <!-- Right Summary Cart Panel in Screen -->
    <rect x="886" y="260" width="246" height="332" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="906" y="280" width="110" height="14" rx="4" fill="#0F172A"/>
    <line x1="906" y1="310" x2="1112" y2="310" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="906" y="326" width="80" height="10" rx="3" fill="#64748B"/>
    <rect x="1066" y="326" width="46" height="10" rx="3" fill="#0F172A"/>

    <rect x="906" y="348" width="95" height="10" rx="3" fill="#64748B"/>
    <rect x="1066" y="348" width="46" height="10" rx="3" fill="#0F172A"/>

    <line x1="906" y1="480" x2="1112" y2="480" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="906" y="500" width="70" height="12" rx="3" fill="#0F172A"/>
    <rect x="1040" y="496" width="72" height="18" rx="4" fill="#5da9e9"/>

    <!-- Checkout Action Bar in Screen -->
    <rect x="906" y="534" width="206" height="42" rx="12" fill="url(#primaryGrad)"/>
    <rect x="966" y="550" width="86" height="10" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Floating Contactless Card Payment Graphic (Left) -->
  <g filter="url(#softShadow)" transform="translate(190, 320) rotate(-10)">
    <rect width="260" height="160" rx="20" fill="url(#darkGrad)"/>
    <rect x="2" y="2" width="256" height="156" rx="18" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
    <!-- Chip -->
    <rect x="30" y="35" width="44" height="34" rx="6" fill="#FBBF24"/>
    <line x1="30" y1="52" x2="74" y2="52" stroke="#B45309" stroke-width="1"/>
    <line x1="52" y1="35" x2="52" y2="69" stroke="#B45309" stroke-width="1"/>
    <!-- Contactless Waves -->
    <path d="M210 40 A16 16 0 0 1 210 68" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M220 32 A26 26 0 0 1 220 76" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Card text lines -->
    <rect x="30" y="110" width="130" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="30" y="128" width="70" height="8" rx="3" fill="#94A3B8" opacity="0.8"/>
  </g>

  <!-- Floating Digital Receipt (Right) -->
  <g filter="url(#softShadow)" transform="translate(1160, 240) rotate(8)">
    <path d="M0 0 L220 0 L220 340 L195 328 L170 340 L145 328 L120 340 L95 328 L70 340 L45 328 L20 340 L0 328 Z" fill="url(#glassGrad)"/>
    <!-- Success Badge -->
    <circle cx="110" cy="50" r="24" fill="url(#accentGrad)"/>
    <path d="M102 50 L108 56 L120 44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Receipt Title -->
    <rect x="60" y="90" width="100" height="12" rx="4" fill="#0F172A"/>
    <line x1="30" y1="120" x2="190" y2="120" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Receipt items -->
    <rect x="30" y="140" width="90" height="8" rx="2" fill="#64748B"/>
    <rect x="150" y="140" width="40" height="8" rx="2" fill="#0F172A"/>
    <rect x="30" y="162" width="70" height="8" rx="2" fill="#64748B"/>
    <rect x="150" y="162" width="40" height="8" rx="2" fill="#0F172A"/>
    <rect x="30" y="184" width="100" height="8" rx="2" fill="#64748B"/>
    <rect x="150" y="184" width="40" height="8" rx="2" fill="#0F172A"/>
    <line x1="30" y1="216" x2="190" y2="216" stroke="#94A3B8" stroke-width="2"/>
    <!-- Total -->
    <rect x="30" y="234" width="50" height="12" rx="3" fill="#0F172A"/>
    <rect x="130" y="234" width="60" height="14" rx="4" fill="#5da9e9"/>
    <!-- Barcode simulation -->
    <rect x="50" y="274" width="120" height="28" fill="#E2E8F0"/>
    <rect x="60" y="276" width="4" height="24" fill="#1E293B"/>
    <rect x="68" y="276" width="8" height="24" fill="#1E293B"/>
    <rect x="80" y="276" width="2" height="24" fill="#1E293B"/>
    <rect x="86" y="276" width="6" height="24" fill="#1E293B"/>
    <rect x="96" y="276" width="10" height="24" fill="#1E293B"/>
    <rect x="110" y="276" width="4" height="24" fill="#1E293B"/>
    <rect x="120" y="276" width="8" height="24" fill="#1E293B"/>
    <rect x="134" y="276" width="4" height="24" fill="#1E293B"/>
    <rect x="142" y="276" width="12" height="24" fill="#1E293B"/>
  </g>

  <!-- Sparkle & Accent Dots -->
  <g fill="#5da9e9">
    <path d="M360 140 Q370 140 370 130 Q370 140 380 140 Q370 140 370 150 Q370 140 360 140 Z"/>
    <path d="M1280 120 Q1292 120 1292 108 Q1292 120 1304 120 Q1292 120 1292 132 Q1292 120 1280 120 Z"/>
    <path d="M300 580 Q312 580 312 568 Q312 580 324 580 Q312 580 312 592 Q312 580 300 580 Z"/>
  </g>
</svg>
